<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - MeowGames07</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
color:#fff;
line-height:1.8;
}

.container{
max-width:700px;
margin:50px auto;
padding:20px;
}

h1{
text-align:center;
color:#22c55e;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 25px;
background:#22c55e;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#16a34a;
}

a{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#22c55e;
color:#fff;
text-decoration:none;
border-radius:8px;
}
</style>

</head>
<body>

<div class="container">

<h1>Contact Us</h1>

<form>

<input type="text" placeholder="Your Name" required>

<input type="email" placeholder="Your Email" required>

<textarea rows="6" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

<a href="index.html">🏠 Back to Home</a>

</div>

</body>
</html>
