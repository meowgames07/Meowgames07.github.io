<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basketball Stars</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{margin:18px 0 5px}

#score{
  font-size:20px;
  margin:10px;
}

#game{
  position:relative;
  width:92vw;
  max-width:650px;
  height:520px;
  margin:15px auto;
  overflow:hidden;
  border:5px solid #555;
  border-radius:18px;
  background:linear-gradient(#69bce8 0%,#dff6ff 65%,#b86b32 65%);
  touch-action:none;
}

#player{
  position:absolute;
  left:18%;
  bottom:10%;
  font-size:55px;
}

#ball{
  position:absolute;
  left:27%;
  bottom:15%;
  font-size:38px;
}

#hoop{
  position:absolute;
  right:12%;
  top:25%;
  width:100px;
  height:90px;
}

.board{
  position:absolute;
  right:0;
  top:0;
  width:65px;
  height:55px;
  background:white;
  border:4px solid #444;
}

.rim{
  position:absolute;
  right:5px;
  bottom:15px;
  width:75px;
  height:18px;
  border:6px solid #ef4444;
  border-radius:50%;
}

.net{
  position:absolute;
  right:17px;
  bottom:-20px;
  width:55px;
  height:35px;
  border-left:3px solid white;
  border-right:3px solid white;
  border-bottom:3px solid white;
}

#power{
  width:260px;
  height:20px;
  margin:10px auto;
  background:#374151;
  border-radius:10px;
  overflow:hidden;
}

#bar{
  width:50%;
  height:100%;
  background:#22c55e;
}

button{
  padding:13px 25px;
  margin:5px;
  border:0;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-size:18px;
  font-weight:bold;
}

#message{
  min-height:28px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🏀 Basketball Stars</h1>

<div id="score">Score: 0</div>

<div id="game">

  <div id="hoop">
    <div class="board"></div>
    <div class="rim"></div>
    <div class="net"></div>
  </div>

  <div id="player">🏀</div>
  <div id="ball">🏀</div>

</div>

<div>Power</div>

<div id="power">
  <div id="bar"></div>
</div>

<button onclick="shoot()">🎯 Shoot</button>
<button onclick="newGame()">🔄 New Game</button>

<div id="message">
Choose your shot!
</div>

<script>

const ball=document.getElementById("ball");
const bar=document.getElementById("bar");
const message=document.getElementById("message");
const scoreText=document.getElementById("score");

let score=0;
let shooting=false;
let power=50;
let direction=1;

setInterval(()=>{

  power+=direction*2;

  if(power>=100){
    power=100;
    direction=-1;
  }

  if(power<=5){
    power=5;
    direction=1;
  }

  bar.style.width=power+"%";

},30);

function shoot(){

  if(shooting)return;

  shooting=true;

  let progress=0;

  const accuracy=
    Math.abs(power-70);

  const timer=setInterval(()=>{

    progress+=0.035;

    let x=27+progress*55;

    let arc=Math.sin(progress*Math.PI)*
            (30+power/2);

    let y=15+progress*48+arc;

    ball.style.left=x+"%";
    ball.style.bottom=y+"%";

    if(progress>=1){

      clearInterval(timer);

      if(accuracy<15){

        score+=20;

        message.textContent=
          "⭐ Perfect shot! +20";

      }else if(accuracy<30){

        score+=10;

        message.textContent=
          "🏀 Great shot! +10";

      }else{

        message.textContent=
          "❌ Missed! Try again.";

      }

      scoreText.textContent=
        "Score: "+score;

      setTimeout(resetBall,700);
    }

  },30);
}

function resetBall(){

  shooting=false;

  ball.style.left="27%";
  ball.style.bottom="15%";
}

function newGame(){

  score=0;

  scoreText.textContent=
    "Score: 0";

  message.textContent=
    "Choose your shot!";

  resetBall();
}

newGame();

</script>

</body>
</html>
