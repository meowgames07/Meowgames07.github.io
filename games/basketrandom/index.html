<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Basket Random</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:18px 0 5px;
}

#score{
  font-size:22px;
  margin:10px;
}

#game{
  position:relative;
  width:92vw;
  max-width:700px;
  height:500px;
  margin:15px auto;
  overflow:hidden;
  border:5px solid #555;
  border-radius:18px;
  background:linear-gradient(
    #6ec6ef 0%,
    #dff6ff 70%,
    #b86b32 70%
  );
  touch-action:none;
}

.player{
  position:absolute;
  bottom:25%;
  width:55px;
  height:80px;
  font-size:48px;
}

#p1{
  left:15%;
}

#p2{
  right:15%;
}

.ball{
  position:absolute;
  left:50%;
  bottom:38%;
  font-size:38px;
  transform:translateX(-50%);
}

.hoop{
  position:absolute;
  width:100px;
  height:90px;
  top:27%;
}

#hoop1{
  left:3%;
}

#hoop2{
  right:3%;
}

.board{
  width:55px;
  height:50px;
  background:white;
  border:4px solid #555;
  position:absolute;
  top:0;
}

.rim{
  position:absolute;
  width:70px;
  height:18px;
  border:6px solid #ef4444;
  border-radius:50%;
  bottom:10px;
}

#hoop1 .board{
  left:0;
}

#hoop1 .rim{
  left:35px;
}

#hoop2 .board{
  right:0;
}

#hoop2 .rim{
  right:35px;
}

button{
  padding:15px 30px;
  margin:5px;
  border:0;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:19px;
  font-weight:bold;
}

#message{
  min-height:28px;
  font-size:18px;
}
</style>
</head>

<body>

<h1>🏀 Basket Random</h1>

<div id="score">
  Player 1: 0 | Player 2: 0
</div>

<div id="game">

  <div id="hoop1" class="hoop">
    <div class="board"></div>
    <div class="rim"></div>
  </div>

  <div id="hoop2" class="hoop">
    <div class="board"></div>
    <div class="rim"></div>
  </div>

  <div id="p1" class="player">🤾</div>
  <div id="p2" class="player">🤾</div>

  <div id="ball" class="ball">🏀</div>

</div>

<button onclick="shoot()">🏀 Shoot</button>
<button onclick="newGame()">🔄 New Game</button>

<div id="message">
Press Shoot to play!
</div>

<script>

const ball=document.getElementById("ball");
const message=document.getElementById("message");
const scoreText=document.getElementById("score");

let score1=0;
let score2=0;
let shooting=false;

function updateScore(){

  scoreText.textContent=
    "Player 1: "+score1+
    " | Player 2: "+score2;
}

function shoot(){

  if(shooting)return;

  shooting=true;

  let direction=
    Math.random()<0.5 ? -1 : 1;

  let progress=0;

  const timer=setInterval(()=>{

    progress+=0.04;

    let x=50+(direction*progress*40);

    let arc=
      Math.sin(progress*Math.PI)*45;

    let y=38+arc-progress*20;

    ball.style.left=x+"%";
    ball.style.bottom=y+"%";

    if(progress>=1){

      clearInterval(timer);

      let scored=Math.random()<0.65;

      if(scored){

        if(direction===1){
          score2++;
          message.textContent=
            "🏀 Player 2 scores!";
        }else{
          score1++;
          message.textContent=
            "🏀 Player 1 scores!";
        }

        updateScore();

      }else{

        message.textContent=
          "😅 Missed! Try again.";
      }

      setTimeout(resetBall,700);
    }

  },30);
}

function resetBall(){

  shooting=false;

  ball.style.left="50%";
  ball.style.bottom="38%";
}

function newGame(){

  score1=0;
  score2=0;

  updateScore();

  message.textContent=
    "Press Shoot to play!";

  resetBall();
}

newGame();

</script>

</body>
</html>
