<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bob the Robber</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{margin:18px 0 5px}

#info{
  font-size:18px;
  margin:10px;
}

#game{
  width:92%;
  max-width:500px;
  height:420px;
  margin:15px auto;
  background:#1f2937;
  border:4px solid #374151;
  border-radius:16px;
  position:relative;
  overflow:hidden;
}

.floor{
  position:absolute;
  left:0;
  right:0;
  bottom:45px;
  height:8px;
  background:#9ca3af;
}

.door{
  position:absolute;
  width:55px;
  height:100px;
  bottom:53px;
  background:#7c3aed;
  border-radius:8px 8px 0 0;
}

.door1{left:20px}
.door2{right:20px}

#bob{
  position:absolute;
  width:48px;
  height:68px;
  left:50%;
  bottom:53px;
  transform:translateX(-50%);
  background:#f59e0b;
  border-radius:18px 18px 8px 8px;
  border:4px solid #92400e;
  transition:.15s;
}

#bob:before{
  content:"🙂";
  position:absolute;
  font-size:25px;
  top:-4px;
  left:7px;
}

.item{
  position:absolute;
  width:45px;
  height:45px;
  background:#22c55e;
  border-radius:10px;
  bottom:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.item1{left:30%}
.item2{right:30%}

#message{
  min-height:30px;
  font-weight:bold;
}

#controls{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:12px auto;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 25px;
  background:#2563eb;
  color:white;
  font-size:20px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}

#restart{
  background:#16a34a;
}
</style>
</head>

<body>

<h1>🕵️ Bob the Robber</h1>

<div id="info">
  Collected: <span id="score">0</span>/2
</div>

<div id="message">
  Collect both items and reach the exit!
</div>

<div id="game">

  <div class="floor"></div>

  <div class="door door1"></div>
  <div class="door door2"></div>

  <div class="item item1">💰</div>
  <div class="item item2">💎</div>

  <div id="
