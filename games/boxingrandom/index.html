<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxing Random</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:18px 0 5px;
}

#score{
  font-size:20px;
  margin:10px;
}

#arena{
  width:94%;
  max-width:600px;
  height:360px;
  margin:15px auto;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#60a5fa 0 65%,#374151 65%);
  border:5px solid #e5e7eb;
  border-radius:15px;
}

.floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:35%;
  background:#4b5563;
}

.player{
  position:absolute;
  bottom:45px;
  width:65px;
  height:95px;
  border-radius:30px 30px 12px 12px;
}

#p1{
  left:15%;
  background:#2563eb;
}

#p2{
  right:15%;
  background:#dc2626;
}

.head{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  background:#fbbf8a;
  top:-35px;
  left:8px;
}

.glove{
  position:absolute;
  width:35px;
  height:35px;
  border-radius:50%;
  top:25px;
  background:#fbbf24;
}

.p1glove{right:-25px}
.p2glove{left:-25px}

#message{
  height:30px;
  font-size:20px;
  font-weight:bold;
}

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:12px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 22px;
  color:white;
  background:#2563eb;
  font-size:18px;
  font-weight:bold;
}

button:active{
  transform:scale(.94);
}

#attack{
  background:#dc2626;
}

#restart{
  background:#16a34a;
}
</style>
</head>

<body>

<h1>🥊 Boxing Random</h1>

<div id="score">
  You: <span id="playerScore">0</span>
  &nbsp; | &nbsp;
  Opponent: <span id="enemyScore">0</span>
</div>

<div id="message">Press Punch!</div>

<div id="arena">

  <div class="floor"></div>

  <div id="p1" class="player">
    <div class="head"></div>
    <div class="glove p1glove"></div>
  </div>

  <div id="p2" class="player">
    <div class="head"></div>
    <div class="glove p2glove"></div>
  </div>

</div>

<div class="controls">
  <button onclick="moveLeft()">⬅️</button>
  <button id="attack" onclick="punch()">🥊 Punch</button>
  <button onclick="moveRight()">➡️</button>
</div>

<button id="restart" onclick="restart()">🔄 Restart</button>

<script>

let playerScore=0;
let enemyScore=0;
let playerX=15;
let enemyX=75;
let gameOver=false;

const p1=document.getElementById("p1");
const p2=document.getElementById("p2");

const playerScoreText=
document.getElementById("playerScore");

const enemyScoreText=
document.getElementById("enemyScore");

const message=
document.getElementById("message");

function moveLeft(){

  if(gameOver)return;

  playerX-=5;

  if(playerX<5)playerX=5;

  p1.style.left=playerX+"%";
}

function moveRight(){

  if(gameOver)return;

  playerX+=5;

  if(playerX>85)playerX=85;

  p1.style.left=playerX+"%";
}

function punch(){

  if(gameOver)return;

  p1.style.transform="translateX(15px)";

  setTimeout(()=>{
    p1.style.transform="translateX(0)";
  },150);

  const distance=Math.abs(playerX-enemyX);

  if(distance<18){

    playerScore++;

    playerScoreText.textContent=playerScore;

    message.textContent="💥 Great hit!";

    if(playerScore>=5){

      gameOver=true;

      message.textContent=
      "🏆 You Win!";

      return;
    }

  }else{

    message.textContent="Miss!";

  }

  setTimeout(enemyAttack,600);
}

function enemyAttack(){

  if(gameOver)return;

  const distance=Math.abs
