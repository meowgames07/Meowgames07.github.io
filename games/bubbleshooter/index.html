<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bubble Shooter</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  touch-action:manipulation;
}

h1{
  margin:18px 0 5px;
}

#score{
  font-size:20px;
  margin:8px;
}

#game{
  width:94%;
  max-width:420px;
  height:540px;
  margin:12px auto;
  position:relative;
  overflow:hidden;
  background:#172554;
  border:4px solid #334155;
  border-radius:16px;
}

.bubble{
  position:absolute;
  width:38px;
  height:38px;
  border-radius:50%;
  border:3px solid #ffffff55;
}

.red{background:#ef4444}
.blue{background:#3b82f6}
.green{background:#22c55e}
.yellow{background:#eab308}
.purple{background:#a855f7}

#shooter{
  position:absolute;
  bottom:15px;
  left:50%;
  width:50px;
  height:50px;
  border-radius:50%;
  transform:translateX(-50%);
  border:4px solid white;
}

#aim{
  position:absolute;
  width:4px;
  height:110px;
  bottom:55px;
  left:50%;
  transform-origin:bottom;
  background:#ffffff88;
}

#nextBubble{
  position:absolute;
  bottom:12px;
  right:12px;
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid white;
}

#message{
  min-height:25px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 24px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<h1>🫧 Bubble Shooter</h1>

<div id="score">Score: 0</div>

<div id="message">Tap the game to shoot!</div>

<div id="game">

  <div id="aim"></div>
  <div id="shooter"></div>
  <div id="nextBubble"></div>

</div>

<button onclick="restart()">🔄 Restart</button>

<script>

const game=document.getElementById("game");
const shooter=document.getElementById("shooter");
const nextBubble=document.getElementById("nextBubble");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");

const colors=[
  "red",
  "blue",
  "green",
  "yellow",
  "purple"
];

let score=0;
let currentColor=randomColor();
let nextColor=randomColor();
let gameOver=false;

function randomColor(){
  return colors[
    Math.floor(Math.random()*colors.length)
  ];
}

function setShooter(){

  shooter.className="";
  shooter.id="shooter";
  shooter.classList.add(currentColor);

  nextBubble.className="";
  nextBubble.id="nextBubble";
  nextBubble.classList.add(nextColor);
}

function createBubble(x,y,color){

  const b=document.createElement("div");

  b.className="bubble "+color;

  b.style.left=x+"px";
  b.style.top=y+"px";

  game.appendChild(b);

  return b;
}

function createBoard(){

  document
    .querySelectorAll(".bubble")
    .forEach(b=>b.remove());

  for(let row=0;row<5;row++){

    for(let col=0;col<8;col++){

      const x=10+col*48;
      const y=10+row*45;

      createBubble(
        x,
        y,
        randomColor()
      );
    }
  }
}

function shoot(clientX,clientY){

  if(gameOver)return;

  const rect=game.getBoundingClientRect();

  let targetX=clientX-rect.left;
  let targetY=clientY-rect.top;

  const startX=
    game.clientWidth/2-19;

  const startY=
    game.clientHeight-65;

  let dx=targetX-startX;
  let dy=targetY-startY;

  if(dy>0)dy=-dy;

  const length=
    Math.sqrt(dx*dx+dy*dy);

  dx/=length;
  dy/=length;

  const bubble=
    createBubble(
      startX,
      startY,
      currentColor
    );

  let x=startX;
  let y=startY;

  const speed=9;

  const timer=setInterval(()=>{

    x+=dx*speed;
    y+=dy*speed;

    if(x<=0 || x>=game.clientWidth-38){
      dx=-dx;
    }

    bubble.style.left=x+"px";
    bubble.style.top=y+"px";

    if(y<=5){

      clearInterval(timer);

      checkMatch(bubble);

      nextShot();

      return;
    }

    const others=
      document.querySelectorAll(".bubble");

    for(const other of others){

      if(other===bubble)continue;

      const ox=parseFloat(other.style.left);
      const oy=parseFloat(other.style.top);

      const distance=
        Math.hypot(
          x-ox,
          y-oy
        );

      if(distance<35){

        clearInterval(timer);

        checkMatch(bubble);

        nextShot();

        return;
      }
    }

  },20);
}

function checkMatch(bubble){

  const color=
    [...bubble.classList]
      .find(c=>colors.includes(c));

  const bubbles=
    [...document.querySelectorAll(".bubble")];

  const same=bubbles.filter(b=>
    b.classList.contains(color)
  );

  if(same.length>=3){

    same.forEach(b=>b.remove());

    score+=same.length*10;

    scoreText.textContent=
      "Score: "+score;

    message.textContent=
      "💥 Great! "+same.length+
      " bubbles popped!";
  }else{

    message.textContent=
      "Try to match 3 bubbles!";
  }

  if(document.querySelectorAll(".bubble").length===0){

    message.textContent=
      "🏆 You Win!";

    gameOver=true;
  }
}

function nextShot(){

  currentColor=nextColor;
  nextColor=randomColor();

  setShooter();
}

function restart(){

  score=0;
  gameOver=false;

  currentColor=randomColor();
  nextColor=randomColor();

  scoreText.textContent="Score: 0";

  message.textContent=
    "Tap the game to shoot!";

  createBoard();
  setShooter();
}

game.addEventListener("click",e=>{

  if(
    e.target===shooter ||
    e.target===nextBubble
  )return;

  shoot(e.clientX,e.clientY);
});

game.addEventListener("touchstart",e=>{

  if(e.touches.length){

    const t=e.touches[0];

    shoot(t.clientX,t.clientY);
  }

},{passive:true});

restart();

</script>

</body>
</html>
