<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullet Force</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:18px 0 5px;
}

#score{
  font-size:20px;
  margin:8px;
}

#game{
  position:relative;
  width:94%;
  max-width:500px;
  height:550px;
  margin:15px auto;
  overflow:hidden;
  border:4px solid #334155;
  border-radius:18px;
  background:
    linear-gradient(#1e293b,#0f172a);
}

.target{
  position:absolute;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#ef4444;
  border:6px solid #f8fafc;
  box-shadow:0 0 15px #ef4444;
  cursor:pointer;
}

#message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 25px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🎯 Bullet Force</h1>

<div id="score">Score: 0</div>

<div id="message">Tap the targets!</div>

<div id="game"></div>

<button onclick="restart()">🔄 Restart</button>

<script>

const game=document.getElementById("game");
const scoreText=document.getElementById("score");
const message=document.getElementById("message");

let score=0;
let timeLeft=30;
let timer;
let playing=false;

function createTarget(){

  if(!playing)return;

  const target=document.createElement("div");

  target.className="target";

  const maxX=game.clientWidth-60;
  const maxY=game.clientHeight-60;

  target.style.left=
    Math.random()*maxX+"px";

  target.style.top=
    Math.random()*maxY+"px";

  target.onclick=function(e){

    e.stopPropagation();

    score+=10;

    scoreText.textContent=
      "Score: "+score;

    message.textContent=
      "🎯 Hit! +10";

    target.remove();

    createTarget();
  };

  game.appendChild(target);

  setTimeout(()=>{

    if(target.parentNode){
      target.remove();
    }

  },1500);
}

function start(){

  playing=true;
  score=0;
  timeLeft=30;

  scoreText.textContent="Score: 0";
  message.textContent=
    "Tap the targets!";

  game.innerHTML="";

  createTarget();

  clearInterval(timer);

  timer=setInterval(()=>{

    timeLeft--;

    if(timeLeft<=0){

      clearInterval(timer);

      playing=false;

      game.innerHTML="";

      message.textContent=
        "🏆 Game Over! Final Score: "+score;

      return;
    }

    createTarget();

  },1000);
}

function restart(){
  start();
}

start();

</script>

</body>
</html>
