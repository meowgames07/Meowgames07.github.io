<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Master</title>
<style>
body{margin:0;background:#111827;color:white;text-align:center;font-family:Arial}
h1{margin:15px}
#board{width:min(92vw,420px);margin:15px auto;display:grid;grid-template-columns:repeat(8,1fr);border:4px solid #374151}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,45px);cursor:pointer}
.light{background:#f1d9b5}.dark{background:#8b5e3c}
.selected{outline:4px solid #22c55e;outline-offset:-4px}
button{padding:12px 25px;border:0;border-radius:10px;background:#22c55e;color:white;font-size:17px}
</style>
</head>
<body>
<h1>♟️ Chess Master</h1>
<div id="info">White's turn</div>
<div id="board"></div>
<button onclick="location.reload()">🔄 Restart</button>

<script>
const pieces=[
"♜","♞","♝","♛","♚","♝","♞","♜",
"♟","♟","♟","♟","♟","♟","♟","♟",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"","","","","","","","",
"♙","♙","♙","♙","♙","♙","♙","♙",
"♖","♘","♗","♕","♔","♗","♘","♖"
];

let selected=-1,turn="white";
const board=document.getElementById("board");

function draw(){
 board.innerHTML="";
 pieces.forEach((p,i)=>{
  let c=document.createElement("div");
  c.className="cell "+((Math.floor(i/8)+i)%2?"dark":"light");
  c.textContent=p;
  if(i===selected)c.classList.add("selected");
  c.onclick=()=>clickCell(i);
  board.appendChild(c);
 });
}

function clickCell(i){
 if(selected<0){
  if(pieces[i]){
   let white="♙♖♘♗♕♔".includes(pieces[i]);
   if((turn==="white"&&white)||(turn==="black"&&!white)){
    selected=i;
   }
  }
 }else{
  if(i!==selected){
   pieces[i]=pieces[selected];
   pieces[selected]="";
   turn=turn==="white"?"black":"white";
  }
  selected=-1;
 }
 document.getElementById("info").textContent=
 turn==="white"?"White's turn":"Black's turn";
 draw();
}
draw();
</script>
</body>
</html>
