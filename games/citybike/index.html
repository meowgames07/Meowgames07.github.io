<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Bike</title>
<style>
body{margin:0;background:#0f172a;color:white;text-align:center;font-family:Arial}
#game{position:relative;width:min(94vw,400px);height:560px;margin:auto;overflow:hidden;background:#334155;border:4px solid #475569}
.road{position:absolute;left:18%;width:64%;height:100%;background:#1f2937}
.line{position:absolute;left:49%;width:2%;height:70px;background:#f8fafc}
#bike{position:absolute;bottom:45px;left:50%;font-size:48px;transform:translateX(-50%)}
.car{position:absolute;font-size:42px}
button{margin:8px;padding:13px 30px;border:0;border-radius:10px;font-size:20px}
</style>
</head>
<body>
<h1>🚲 City Bike</h1>
<div>Score: <b id="score">0</b></div>
<div id="game"><div class="road"></div><div id="bike">🚲</div></div>
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>
<button onclick="location.reload()">🔄</button>

<script>
let x=50,score=0,run=true;
const bike=document.getElementById("bike"),game=document.getElementById("game");

function move(d){
 if(!run)return;
 x+=d*8;
 x=Math.max(25,Math.min(75,x));
 bike.style.left=x+"%";
}

function spawn(){
 if(!run)return;
 let c=document.createElement("div");
 c.className="car";
 c.textContent=["🚗","🚌","🚕"][Math.floor(Math.random()*3)];
 c.style.left=(25+Math.random()*50)+"%";
 c.style.top="-60px";
 game.appendChild(c);

 let y=-60;
 let timer=setInterval(()=>{
  if(!run){clearInterval(timer);c.remove();return}
  y+=5;c.style.top=y+"px";
  let a=bike.getBoundingClientRect(),b=c.getBoundingClientRect();
  if(!(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)){
   run=false;alert("Game Over! Score: "+score);
   clearInterval(timer);
  }
  if(y>570){
   score++;document.getElementById("score").textContent=score;
   clearInterval(timer);c.remove();
  }
 },30);
}
setInterval(spawn,900);
document.onkeydown=e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1)};
</script>
</body>
</html>
