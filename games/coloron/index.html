<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color On</title>
<style>
body{margin:0;background:#111827;color:white;text-align:center;font-family:Arial}
#game{position:relative;width:min(94vw,400px);height:550px;margin:auto;background:#0f172a;overflow:hidden;border:4px solid #475569;border-radius:18px}
.dot{position:absolute;width:50px;height:50px;border-radius:50%;cursor:pointer}
.red{background:#ef4444}.blue{background:#3b82f6}.green{background:#22c55e}.yellow{background:#eab308}
button{padding:12px 25px;margin:10px;border:0;border-radius:10px;font-size:18px}
</style>
</head>
<body>
<h1>🎨 Color On</h1>
<div>Score: <b id="score">0</b></div>
<div id="game"></div>
<button onclick="start()">🔄 Restart</button>

<script>
const game=document.getElementById("game");
let score=0,playing=true;

function create(){
 if(!playing)return;
 let d=document.createElement("div");
 let colors=["red","blue","green","yellow"];
 d.className="dot "+colors[Math.floor(Math.random()*4)];
 d.style.left=Math.random()*85+"%";
 d.style.top=Math.random()*85+"%";
 d.onclick=()=>{
  score++;
  document.getElementById("score").textContent=score;
  d.remove();
  create();
 };
 game.appendChild(d);
}

function start(){
 game.innerHTML="";
 score=0;playing=true;
 document.getElementById("score").textContent=0;
 for(let i=0;i<5;i++)create();
}
start();
</script>
</body>
</html>
