<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy Cars</title>

<style>
body{
  margin:0;
  background:#111827;
  color:white;
  text-align:center;
  font-family:Arial;
}

#game{
  width:90%;
  max-width:400px;
  height:550px;
  margin:20px auto;
  background:#444;
  position:relative;
  overflow:hidden;
  border:4px solid white;
}

#car{
  position:absolute;
  bottom:20px;
  left:45%;
  font-size:45px;
}

.enemy{
  position:absolute;
  font-size:40px;
}

button{
  padding:15px 30px;
  margin:8px;
  font-size:20px;
  border:0;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🏎️ Crazy Cars</h1>
<h2>Score: <span id="score">0</span></h2>

<div id="game">
  <div id="car">🏎️</div>
</div>

<button onclick="left()">⬅️</button>
<button onclick="right()">➡️</button>

<script>

let car = document.getElementById("car");
let score = 0;
let x = 45;

function left(){
  x = x - 5;
  if(x < 0) x = 0;
  car.style.left = x + "%";
}

function right(){
  x = x + 5;
  if(x > 90) x = 90;
  car.style.left = x + "%";
}

function enemy(){

  let e = document.createElement("div");

  e.className = "enemy";
  e.innerHTML = "🚗";

  e.style.left = Math.random()*85 + "%";
  e.style.top = "-50px";

  document.getElementById("game").appendChild(e);

  let y = -50;

  let move = setInterval(function(){

    y = y + 5;
    e.style.top = y + "px";

    if(y > 550){

      clearInterval(move);
      e.remove();

      score++;
      document.getElementById("score").innerText = score;
    }

  },50);
}

setInterval(enemy,1000);

</script>

</body>
</html>
