<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duck Life</title>
<style>
body{margin:0;background:#87ceeb;text-align:center;font-family:Arial}
h1{color:white}
#game{width:95%;max-width:500px;height:550px;margin:auto;background:#62b84f;border:4px solid #333;position:relative;overflow:hidden}
#duck{position:absolute;font-size:55px;bottom:30px;left:45%}
#coin{position:absolute;font-size:35px;top:100px;left:70%}
button{padding:15px 30px;margin:8px;font-size:20px}
</style>
</head>
<body>
<h1>🦆 Duck Life</h1>
<h2>Score: <span id="score">0</span></h2>
<div id="game">
<div id="duck">🦆</div>
<div id="coin">⭐</div>
</div>
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>

<script>
let duck=document.getElementById("duck"),coin=document.getElementById("coin");
let score=0,x=45;

function move(d){
 x+=d*8;
 if(x<0)x=0;if(x>90)x=90;
 duck.style.left=x+"%";
}

setInterval(()=>{
 let y=parseInt(coin.style.top);
 y+=6;
 if(y>530){
  y=20;
  coin.style.left=Math.random()*85+"%";
 }
 coin.style.top=y+"px";

 let cx=parseFloat(coin.style.left);
 if(y>450 && Math.abs(x-cx)<12){
  score++;
  document.getElementById("score").innerText=score;
  y=20;
  coin.style.left=Math.random()*85+"%";
 }
},100);
</script>
</body>
</html>
