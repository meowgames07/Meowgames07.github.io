<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix Jump</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
#game{width:95%;max-width:400px;height:550px;margin:auto;background:#263238;position:relative;overflow:hidden}
#ball{position:absolute;font-size:40px;left:45%;top:40px}
.platform{position:absolute;width:70%;height:18px;left:15%;background:#ff9800}
button{padding:15px 40px;font-size:20px;margin:10px}
</style>
</head>
<body>
<h1>🌀 Helix Jump</h1>
<h2>Score: <span id="score">0</span></h2>
<div id="game">
<div id="ball">🔴</div>
<div class="platform" style="top:150px"></div>
<div class="platform" style="top:280px"></div>
<div class="platform" style="top:410px"></div>
</div>
<button onclick="jump()">⬇️ JUMP</button>
<script>
let ball=document.getElementById("ball"),y=40,score=0;
function jump(){
 y+=90;
 if(y>480)y=40;
 ball.style.top=y+"px";
 score++;
 document.getElementById("score").innerText=score;
}
</script>
</body>
</html>
