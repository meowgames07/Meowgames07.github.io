<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masked Forces</title>
<style>
body{margin:0;background:#151515;color:white;text-align:center;font-family:Arial}
#game{width:95%;max-width:500px;height:500px;margin:auto;background:#263238;position:relative;overflow:hidden}
#player{position:absolute;bottom:30px;left:45%;font-size:50px}
#target{position:absolute;top:70px;left:40%;font-size:45px}
button{padding:15px 35px;font-size:20px;margin:10px}
</style>
</head>
<body>
<h1>🎭 Masked Forces</h1>
<h2>Score: <span id="score">0</span></h2>
<div id="game">
<div id="player">🥷</div>
<div id="target">🎯</div>
</div>
<button onclick="hit()">🎯 HIT TARGET</button>
<script>
let score=0;
function hit(){
 score++;
 document.getElementById("score").innerText=score;
 let t=document.getElementById("target");
 t.style.left=Math.random()*85+"%";
 t.style.top=Math.random()*350+"px";
}
</script>
</body>
</html>
