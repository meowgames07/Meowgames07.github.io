<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moto Fury</title>
<style>
body{margin:0;background:#222;color:white;text-align:center;font-family:Arial}
#road{width:94vw;max-width:500px;height:550px;margin:auto;background:#555;position:relative}
#bike{position:absolute;bottom:30px;left:45%;font-size:50px}
button{padding:15px 35px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>🏍️ Moto Fury</h1>
<h2>Distance: <span id="d">0</span></h2>
<div id="road"><div id="bike">🏍️</div></div>
<button onclick="go()">⚡ ACCELERATE</button>
<script>
let d=0;
function go(){d+=10;document.getElementById("d").textContent=d}
</script>
</body>
</html>
