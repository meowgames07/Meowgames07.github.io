<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raft Wars</title>
<style>
body{margin:0;background:#29b6f6;color:white;text-align:center;font-family:Arial}
#sea{width:94vw;max-width:500px;height:500px;margin:auto;background:#0288d1;position:relative}
#raft{position:absolute;bottom:60px;left:30px;font-size:60px}
#target{position:absolute;top:80px;right:30px;font-size:50px}
button{padding:15px 30px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>🛶 Raft Wars</h1>
<div id="sea"><div id="raft">🛶</div><div id="target">🎯</div></div>
<button onclick="fire()">🚀 FIRE</button>
<script>
function fire(){
document.getElementById("target").textContent="💥";
setTimeout(()=>alert("Target Hit!"),300);
}
</script>
</body>
</html>
