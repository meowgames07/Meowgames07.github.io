<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run 3</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
#tunnel{width:94vw;max-width:500px;height:500px;margin:auto;background:#263238;position:relative;overflow:hidden}
#player{position:absolute;bottom:40px;left:40px;font-size:45px}
button{padding:15px 30px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>🏃 Run 3</h1>
<h2>Distance: <span id="d">0</span></h2>
<div id="tunnel"><div id="player">🏃</div></div>
<button onclick="run()">RUN ➡️</button>
<button onclick="jump()">⬆️ JUMP</button>
<script>
let d=0,p=document.getElementById("player");
function run(){
d+=10;
document.getElementById("d").textContent=d;
}
function jump(){
p.style.bottom="200px";
setTimeout(()=>p.style.bottom="40px",500);
}
</script>
</body>
</html>
