<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slither.io</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
#game{width:94vw;max-width:500px;height:500px;margin:auto;background:#1b5e20;position:relative}
#snake{position:absolute;left:40%;top:40%;font-size:45px}
button{padding:15px 30px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>🐍 Slither.io</h1>
<h2>Score: <span id="s">0</span></h2>
<div id="game"><div id="snake">🐍</div></div>
<button onclick="eat()">EAT 🍎</button>
<script>
let s=0;
function eat(){
s++;
document.getElementById("s").textContent=s;
document.getElementById("snake").style.left=Math.random()*80+"%";
document.getElementById("snake").style.top=Math.random()*80+"%";
}
</script>
</body>
</html>
