<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slope</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
#game{width:94vw;max-width:500px;height:500px;margin:auto;background:#263238;position:relative}
#ball{position:absolute;left:40%;top:40%;font-size:45px}
button{padding:15px 30px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>⚪ Slope</h1>
<h2>Score: <span id="s">0</span></h2>
<div id="game"><div id="ball">🔴</div></div>
<button onclick="move()">MOVE ➡️</button>
<script>
let s=0;
function move(){
s++;
document.getElementById("s").textContent=s;
document.getElementById("ball").style.left=Math.random()*80+"%";
document.getElementById("ball").style.top=Math.random()*80+"%";
}
</script>
</body>
</html>
