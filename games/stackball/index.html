<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stack Ball</title>
<style>
body{margin:0;background:#222;color:white;text-align:center;font-family:Arial}
#game{width:94vw;max-width:500px;height:500px;margin:auto;background:#333;position:relative}
#ball{position:absolute;bottom:50px;left:45%;font-size:45px}
button{padding:15px 30px;margin:15px;font-size:20px}
</style>
</head>
<body>
<h1>🔴 Stack Ball</h1>
<h2>Score: <span id="s">0</span></h2>
<div id="game"><div id="ball">🔴</div></div>
<button onclick="drop()">DROP ⬇️</button>
<script>
let s=0;
function drop(){
s++;
document.getElementById("s").textContent=s;
document.getElementById("ball").style.bottom=(50+Math.random()*300)+"px";
}
</script>
</body>
</html>
