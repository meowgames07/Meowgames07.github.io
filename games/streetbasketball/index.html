<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Basketball</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
h1{margin:20px}
.game{width:95%;max-width:500px;height:500px;margin:auto;background:#d2691e;border:4px solid #fff;position:relative}
.ball{width:45px;height:45px;background:#f60;border-radius:50%;position:absolute;left:45%;top:60%;cursor:pointer}
button{padding:12px 25px;margin:15px;font-size:18px}
</style>
</head>
<body>
<h1>🏀 Street Basketball</h1>
<p>Ball ko click karke score karo!</p>
<div class="game">
<div class="ball" onclick="score()">🏀</div>
</div>
<h2>Score: <span id="score">0</span></h2>
<script>
let s=0;
function score(){
s++;
document.getElementById("score").textContent=s;
let b=document.querySelector(".ball");
b.style.left=Math.random()*85+"%";
b.style.top=Math.random()*85+"%";
}
</script>
</body>
</html>
