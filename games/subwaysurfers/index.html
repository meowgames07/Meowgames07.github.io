<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subway Surfers</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
.game{width:300px;height:500px;margin:auto;background:#444;position:relative;overflow:hidden}
.player{position:absolute;bottom:20px;left:125px;font-size:45px}
.coin{position:absolute;font-size:30px;cursor:pointer}
button{padding:12px 25px;font-size:18px;margin:15px}
</style>
</head>
<body>
<h1>🏃 Subway Surfers</h1>
<div class="game">
<div class="player">🏃</div>
<div class="coin" id="coin" onclick="getCoin()">🪙</div>
</div>
<h2>Score: <span id="score">0</span></h2>
<script>
let s=0;
function getCoin(){
s++;
score.textContent=s;
coin.style.left=Math.random()*260+"px";
coin.style.top=Math.random()*450+"px";
}
</script>
</body>
</html>
