<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Open</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
.game{width:320px;height:420px;background:#16833a;margin:auto;border:4px solid white;position:relative}
.ball{position:absolute;font-size:35px;cursor:pointer}
button{padding:12px 25px;font-size:18px;margin:15px}
</style>
</head>
<body>
<h1>🎾 Tennis Open</h1>
<div class="game"><div class="ball" id="ball" onclick="hit()">🎾</div></div>
<h2>Points: <span id="score">0</span></h2>
<script>
let s=0;
function hit(){
s++;score.textContent=s;
ball.style.left=Math.random()*280+"px";
ball.style.top=Math.random()*380+"px";
}
</script>
</body>
</html>
