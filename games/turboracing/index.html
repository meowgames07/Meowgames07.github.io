<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Racing</title>
<style>
body{background:#111;color:white;text-align:center;font-family:Arial}
.game{width:300px;height:500px;background:#333;margin:auto;position:relative}
.car{position:absolute;bottom:20px;left:125px;font-size:45px}
button{padding:12px 25px;font-size:18px;margin:15px}
</style>
</head>
<body>
<h1>🏎️ Turbo Racing</h1>
<div class="game"><div class="car" id="car">🏎️</div></div>
<button onclick="move(-25)">⬅️</button>
<button onclick="turbo()">⚡ TURBO</button>
<button onclick="move(25)">➡️</button>
<h2>Speed: <span id="speed">0</span></h2>
<script>
let s=0;
function move(x){
let p=parseInt(car.style.left||125)+x;
car.style.left=Math.max(0,Math.min(250,p))+"px";
}
function turbo(){
s+=20;speed.textContent=s;
}
</script>
</body>
</html>
