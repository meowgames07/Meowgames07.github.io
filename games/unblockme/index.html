<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unblock Me</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
.game{width:300px;height:300px;background:#333;margin:30px auto;position:relative;border:3px solid #777}
.block{position:absolute;width:80px;height:45px;background:#e74c3c;top:125px;left:40px}
.exit{position:absolute;right:0;top:120px;width:25px;height:60px;background:#2ecc71}
button{padding:12px 25px;font-size:18px}
</style>
</head>
<body>
<h1>🧩 Unblock Me</h1>
<p>Red block ko exit tak pahunchao.</p>

<div class="game">
<div class="block" id="block"></div>
<div class="exit"></div>
</div>

<button onclick="move()">➡️ Move</button>
<h2 id="msg"></h2>

<script>
let x=40;
function move(){
x+=40;
block.style.left=x+"px";
if(x>=220) msg.textContent="🎉 Level Complete!";
}
</script>
</body>
</html>
