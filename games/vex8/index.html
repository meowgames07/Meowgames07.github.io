<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vex 8</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
.game{width:300px;height:500px;background:#444;margin:auto;position:relative;overflow:hidden}
.player{position:absolute;bottom:20px;left:130px;font-size:40px}
.obstacle{position:absolute;bottom:0;right:20px;font-size:45px}
button{padding:12px 25px;font-size:18px;margin:15px}
</style>
</head>
<body>
<h1>🏃 Vex 8</h1>

<div class="game">
<div class="player" id="player">🏃</div>
<div class="obstacle">🔺</div>
</div>

<button onclick="jump()">⬆️ JUMP</button>
<h2 id="msg">Ready!</h2>

<script>
function jump(){
player.style.bottom="150px";
msg.textContent="🚀 Jump!";
setTimeout(()=>{
player.style.bottom="20px";
msg.textContent="Keep Running!";
},600);
}
</script>
</body>
</html>
