<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Derby</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
.game{width:300px;height:500px;background:#333;margin:auto;position:relative;overflow:hidden}
.car{position:absolute;bottom:20px;left:125px;font-size:45px}
.zombie{position:absolute;top:40px;left:130px;font-size:40px;cursor:pointer}
button{padding:12px 25px;font-size:18px;margin:15px}
</style>
</head>
<body>
<h1>🧟 Zombie Derby</h1>
<div class="game">
<div class="zombie" id="zombie" onclick="hit()">🧟</div>
<div class="car">🚗</div>
</div>
<h2>Score: <span id="score">0</span></h2>
<script>
let s=0;
function hit(){
s++;
score.textContent=s;
zombie.style.left=Math.random()*250+"px";
zombie.style.top=Math.random()*400+"px";
}
</script>
</body>
</html>
